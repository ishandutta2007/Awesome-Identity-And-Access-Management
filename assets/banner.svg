<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
        50% { stroke-dashoffset: 40; opacity: 0.8; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatPillDelayed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes orbitRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes radarSweep {
        0% { opacity: 0.15; transform: scale(0.9); }
        50% { opacity: 0.45; transform: scale(1.05); }
        100% { opacity: 0.15; transform: scale(0.9); }
      }
      .anim-beam {
        stroke-dasharray: 10, 15;
        animation: pulseBeam 6s linear infinite;
      }
      .anim-pill-1 {
        animation: floatPill 5s ease-in-out infinite;
      }
      .anim-pill-2 {
        animation: floatPillDelayed 6s ease-in-out infinite;
      }
      .anim-radar {
        transform-origin: 1050px 170px;
        animation: radarSweep 4s ease-in-out infinite;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0 40 L 1200 40 M 0 100 L 1200 100 M 0 160 L 1200 160 M 0 220 L 1200 220 M 0 280 L 1200 280" stroke="#94a3b8" stroke-width="1" />
    <path d="M 120 0 L 120 340 M 240 0 L 240 340 M 360 0 L 360 340 M 480 0 L 480 340 M 600 0 L 600 340 M 720 0 L 720 340 M 840 0 L 840 340 M 960 0 L 960 340 M 1080 0 L 1080 340" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Background Ambient Glows -->
  <circle cx="150" cy="170" r="140" fill="url(#glowG)" filter="url(#softGlow)" />
  <circle cx="1050" cy="170" r="130" fill="url(#glowG)" filter="url(#softGlow)" />

  <!-- Dynamic Background Connection Lines / Flow -->
  <g class="anim-beam">
    <path d="M 90 260 C 250 280, 400 300, 600 270 C 800 240, 950 290, 1110 240" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 90 80 C 280 60, 480 40, 700 70 C 920 100, 1020 50, 1110 90" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Animated Radar / Identity Verification Rings on the Right (Background) -->
  <g class="anim-radar">
    <circle cx="1050" cy="170" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4, 4" />
    <circle cx="1050" cy="170" r="105" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6, 6" />
    <circle cx="1050" cy="170" r="135" fill="none" stroke="#c084fc" stroke-width="0.75" />
  </g>

  <!-- Shield & Keylock Visual Identity Emblem (Left Side) -->
  <g transform="translate(60, 95)" filter="url(#cardShadow)">
    <rect width="90" height="150" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1.5" />
    <!-- Shield Outline -->
    <path d="M 45 28 L 72 40 C 72 80, 56 108, 45 118 C 34 108, 18 80, 18 40 Z" fill="url(#accentCyan)" opacity="0.25" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Keyhole -->
    <circle cx="45" cy="62" r="8" fill="#38bdf8" />
    <polygon points="41,62 49,62 52,86 38,86" fill="#38bdf8" />
    <circle cx="45" cy="62" r="4" fill="#0f172a" />
  </g>

  <!-- FOREGROUND: Main Title & Subtitle (Crisp & High Contrast) -->
  <g class="sans-text">
    <!-- Header Pill / Tag -->
    <g transform="translate(180, 52)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="14" cy="14" r="4" fill="#10b981" />
      <text x="26" y="18" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">ZERO TRUST &bull; ENTERPRISE IAM</text>
    </g>

    <!-- Main Title -->
    <text x="180" y="128" fill="url(#titleGradient)" font-size="44" font-weight="800" letter-spacing="-1">
      Identity &amp; Access Management
    </text>

    <!-- Subtitle -->
    <text x="180" y="170" fill="#e2e8f0" font-size="18" font-weight="400" letter-spacing="0.2">
      Curated Landscape of SSO, IdP, MFA, CIAM &amp; Production Open-Source Systems
    </text>

    <!-- Tech Specs / Standards Ribbon -->
    <g transform="translate(180, 205)" class="mono-text">
      <text x="0" y="0" fill="#64748b" font-size="13">STANDARDS:</text>
      <text x="95" y="0" fill="#38bdf8" font-size="13" font-weight="600">SAML 2.0</text>
      <text x="175" y="0" fill="#64748b" font-size="13">&bull;</text>
      <text x="195" y="0" fill="#818cf8" font-size="13" font-weight="600">OIDC / OAuth 2.1</text>
      <text x="330" y="0" fill="#64748b" font-size="13">&bull;</text>
      <text x="350" y="0" fill="#34d399" font-size="13" font-weight="600">SCIM 2.0</text>
      <text x="425" y="0" fill="#64748b" font-size="13">&bull;</text>
      <text x="445" y="0" fill="#f472b6" font-size="13" font-weight="600">FIDO2 / WebAuthn</text>
      <text x="590" y="0" fill="#64748b" font-size="13">&bull;</text>
      <text x="610" y="0" fill="#fbbf24" font-size="13" font-weight="600">LDAP / Kerberos</text>
    </g>
  </g>

  <!-- DYNAMIC FLOATING PILLS / BADGES (Layered underneath bottom-right) -->
  <!-- Pill Group 1 -->
  <g class="anim-pill-1 sans-text" transform="translate(180, 245)">
    <!-- Pill A: Keycloak -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.2" />
      <text x="14" y="22" fill="#93c5fd" font-size="13" font-weight="600">&#9679; Keycloak</text>
      <text x="88" y="22" fill="#64748b" font-size="11">37k&#9733;</text>
    </g>
    <!-- Pill B: Authelia -->
    <g transform="translate(147, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.2" />
      <text x="14" y="22" fill="#67e8f9" font-size="13" font-weight="600">&#9679; Authelia</text>
      <text x="88" y="22" fill="#64748b" font-size="11">29k&#9733;</text>
    </g>
    <!-- Pill C: Authentik -->
    <g transform="translate(294, 0)">
      <rect width="140" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" />
      <text x="14" y="22" fill="#fcd34d" font-size="13" font-weight="600">&#9679; Authentik</text>
      <text x="94" y="22" fill="#64748b" font-size="11">26k&#9733;</text>
    </g>
    <!-- Pill D: Ory Hydra -->
    <g transform="translate(446, 0)">
      <rect width="140" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="22" fill="#c4b5fd" font-size="13" font-weight="600">&#9679; Ory Hydra</text>
      <text x="94" y="22" fill="#64748b" font-size="11">17k&#9733;</text>
    </g>
    <!-- Pill E: ZITADEL -->
    <g transform="translate(598, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="22" fill="#6ee7b7" font-size="13" font-weight="600">&#9679; ZITADEL</text>
      <text x="88" y="22" fill="#64748b" font-size="11">15k&#9733;</text>
    </g>
    <!-- Pill F: Casdoor -->
    <g transform="translate(745, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" />
      <text x="14" y="22" fill="#f472b6" font-size="13" font-weight="600">&#9679; Casdoor</text>
      <text x="88" y="22" fill="#64748b" font-size="11">14k&#9733;</text>
    </g>
  </g>
</svg>
